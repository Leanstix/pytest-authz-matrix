[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-authz-matrix"
version = "0.1.1"
description = "Authorization contract testing for Python web APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Aleshinloye Olamilekan" },
]
keywords = ["pytest", "authorization", "django", "drf", "security", "multi-tenant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Framework :: Django",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Security",
]
dependencies = [
  "pytest>=7.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
django = [
  "Django>=4.2,<6.2",
  "djangorestframework>=3.15.2,<3.19",
  "pytest-django>=4.8,<5",
]
dev = [
  "build>=1.2",
  "Django>=4.2,<6.2",
  "djangorestframework>=3.15.2,<3.19",
  "mypy>=1.10",
  "pytest-cov>=5",
  "pytest-django>=4.8,<5",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.entry-points.pytest11]
authz_matrix = "pytest_authz_matrix.plugin"

[project.urls]
Homepage = "https://github.com/Leanstix/pytest-authz-matrix"
Issues = "https://github.com/Leanstix/pytest-authz-matrix/issues"
Repository = "https://github.com/Leanstix/pytest-authz-matrix"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pytest_authz_matrix = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["pytest_authz_matrix"]
