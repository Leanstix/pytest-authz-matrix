name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=pytest_authz_matrix --cov-report=term-missing
      - name: FastAPI example
        run: >-
          pytest examples/fastapi/test_authorization.py
          --authz-config=examples/fastapi/authz-matrix.yml
          --authz-report
          --authz-fail-under=100
      - name: Lint
        run: ruff check src tests ci
      - name: Type check
        run: mypy src
      - name: Build distributions
        run: python -m build

  fastapi-minimum:
    name: FastAPI minimum version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the oldest supported FastAPI
        run: python -m pip install -e ".[fastapi]" "fastapi==0.110.1"
      - name: Test FastAPI integration
        run: >-
          pytest tests/test_fastapi_adapter.py tests/test_fastapi_case.py
          tests/test_fastapi_defaults.py tests/test_fastapi_plugin.py

  django-minimum:
    name: Django and DRF minimum versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the oldest supported Django and DRF
        run: python -m pip install -e ".[django]" "Django==4.2" "djangorestframework==3.14.0"
      - name: Test Django authorization
        run: pytest tests/test_django_defaults.py tests/test_django_adapter.py

  package-artifacts:
    name: Package artifact smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Validate artifact contents
        run: python ci/check_artifacts.py
      - name: Smoke test installed wheel
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python -m pytest ci/installed_smoke -q \
            --authz-config=ci/installed_smoke/authz-matrix.yml
      - name: Exercise the installed wheel against Django, DRF, and FastAPI apps
        run: |
          wheel_url="file://$(realpath dist/*.whl)"
          .venv-wheel/bin/python -m pip install "pytest-authz-matrix[django,fastapi] @ ${wheel_url}"
          .venv-wheel/bin/python -m pytest -q tests/test_coverage_end_to_end.py
      - name: Smoke test installed source distribution
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-sdist/bin/python -m pytest ci/installed_smoke -q \
            --authz-config=ci/installed_smoke/authz-matrix.yml
      - name: Run tests bundled in source distribution
        run: |
          mkdir sdist-tree
          tar -xzf dist/*.tar.gz -C sdist-tree --strip-components=1
          python -m venv .venv-sdist-tests
          .venv-sdist-tests/bin/python -m pip install "./sdist-tree[dev]"
          cd sdist-tree
          ../.venv-sdist-tests/bin/python -m pytest
