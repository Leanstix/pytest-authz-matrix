name: CI

on:
  push:
    branches: [main, 0.1.x]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=pytest_authz_matrix --cov-report=term-missing
      - name: Lint
        run: ruff check src tests ci
      - name: Type check
        run: mypy src
      - name: Build distributions
        run: python -m build

  django-compatibility:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-label }} / DRF ${{ matrix.drf-label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django: "~=4.2.0"
            django-label: "4.2"
            drf: "==3.15.2"
            drf-label: "3.15.2"
          - python-version: "3.12"
            django: "~=4.2.0"
            django-label: "4.2"
            drf: "==3.17.2"
            drf-label: "3.17.2"
          - python-version: "3.10"
            django: "~=5.0.0"
            django-label: "5.0"
            drf: "==3.15.2"
            drf-label: "3.15.2"
          - python-version: "3.12"
            django: "~=5.0.0"
            django-label: "5.0"
            drf: "==3.17.2"
            drf-label: "3.17.2"
          - python-version: "3.10"
            django: "~=5.1.0"
            django-label: "5.1"
            drf: "==3.16.1"
            drf-label: "3.16.1"
          - python-version: "3.13"
            django: "~=5.1.0"
            django-label: "5.1"
            drf: "==3.17.2"
            drf-label: "3.17.2"
          - python-version: "3.10"
            django: "~=5.2.0"
            django-label: "5.2"
            drf: "==3.16.1"
            drf-label: "3.16.1"
          - python-version: "3.14"
            django: "~=5.2.0"
            django-label: "5.2"
            drf: "==3.18.0"
            drf-label: "3.18.0"
          - python-version: "3.12"
            django: "~=6.0.0"
            django-label: "6.0"
            drf: "==3.17.2"
            drf-label: "3.17.2"
          - python-version: "3.14"
            django: "~=6.0.0"
            django-label: "6.0"
            drf: "==3.18.0"
            drf-label: "3.18.0"
          - python-version: "3.12"
            django: "~=6.1.0"
            django-label: "6.1"
            drf: "==3.18.0"
            drf-label: "3.18.0"
          - python-version: "3.14"
            django: "~=6.1.0"
            django-label: "6.1"
            drf: "==3.18.0"
            drf-label: "3.18.0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned compatibility environment
        run: >-
          python -m pip install -e .
          "Django${{ matrix.django }}"
          "djangorestframework${{ matrix.drf }}"
          "pytest-django>=4.8,<5"
          "pytest-xdist>=3.6,<4"
      - name: Verify resolved versions
        env:
          EXPECTED_DJANGO: ${{ matrix.django-label }}
          EXPECTED_DRF: ${{ matrix.drf-label }}
        run: |
          python - <<'PY'
          import os
          import platform

          import django
          import rest_framework

          django_version = django.get_version()
          drf_version = rest_framework.VERSION
          expected_django = os.environ["EXPECTED_DJANGO"]
          print(f"Python {platform.python_version()}")
          print(f"Django {django_version}")
          print(f"Django REST Framework {drf_version}")
          assert django_version == expected_django or django_version.startswith(
              f"{expected_django}."
          )
          assert drf_version == os.environ["EXPECTED_DRF"]
          PY
      - name: Test pinned compatibility environment
        run: pytest

  package-artifacts:
    name: Package artifact smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Validate artifact contents
        run: python ci/check_artifacts.py
      - name: Smoke test installed wheel
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install dist/*.whl
          .venv-wheel/bin/python -m pytest ci/installed_smoke -q \
            --authz-config=ci/installed_smoke/authz-matrix.yml
      - name: Smoke test installed source distribution
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install dist/*.tar.gz
          .venv-sdist/bin/python -m pytest ci/installed_smoke -q \
            --authz-config=ci/installed_smoke/authz-matrix.yml
      - name: Run tests bundled in source distribution
        run: |
          mkdir sdist-tree
          tar -xzf dist/*.tar.gz -C sdist-tree --strip-components=1
          python -m venv .venv-sdist-tests
          .venv-sdist-tests/bin/python -m pip install "./sdist-tree[dev]"
          cd sdist-tree
          ../.venv-sdist-tests/bin/python -m pytest
