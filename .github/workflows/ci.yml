name: CI

on:
  push:
    branches: [main, 0.1.x]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest --cov=pytest_authz_matrix --cov-report=term-missing
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Build distributions
        run: python -m build

  django-compatibility:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-label }} / DRF ${{ matrix.drf-label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django: "~=4.2.0"
            django-label: "4.2"
            drf: "==3.15.2"
            drf-label: "3.15.2"
          - python-version: "3.12"
            django: "~=4.2.0"
            django-label: "4.2"
            drf: "==3.17.2"
            drf-label: "3.17.2"
          - python-version: "3.10"
            django: "~=5.0.0"
            django-label: "5.0"
            drf: "==3.15.2"
            drf-label: "3.15.2"
          - python-version: "3.12"
            django: "~=5.0.0"
            django-label: "5.0"
            drf: "==3.17.2"
            drf-label: "3.17.2"
          - python-version: "3.10"
            django: "~=5.1.0"
            django-label: "5.1"
            drf: "==3.16.1"
            drf-label: "3.16.1"
          - python-version: "3.13"
            django: "~=5.1.0"
            django-label: "5.1"
            drf: "==3.17.2"
            drf-label: "3.17.2"
          - python-version: "3.10"
            django: "~=5.2.0"
            django-label: "5.2"
            drf: "==3.16.1"
            drf-label: "3.16.1"
          - python-version: "3.14"
            django: "~=5.2.0"
            django-label: "5.2"
            drf: "==3.18.0"
            drf-label: "3.18.0"
          - python-version: "3.12"
            django: "~=6.0.0"
            django-label: "6.0"
            drf: "==3.17.2"
            drf-label: "3.17.2"
          - python-version: "3.14"
            django: "~=6.0.0"
            django-label: "6.0"
            drf: "==3.18.0"
            drf-label: "3.18.0"
          - python-version: "3.12"
            django: "~=6.1.0"
            django-label: "6.1"
            drf: "==3.18.0"
            drf-label: "3.18.0"
          - python-version: "3.14"
            django: "~=6.1.0"
            django-label: "6.1"
            drf: "==3.18.0"
            drf-label: "3.18.0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned compatibility environment
        run: >-
          python -m pip install -e .
          "Django${{ matrix.django }}"
          "djangorestframework${{ matrix.drf }}"
      - name: Verify resolved versions
        env:
          EXPECTED_DJANGO: ${{ matrix.django-label }}
          EXPECTED_DRF: ${{ matrix.drf-label }}
        run: |
          python - <<'PY'
          import os
          import platform

          import django
          import rest_framework

          django_version = django.get_version()
          drf_version = rest_framework.VERSION
          print(f"Python {platform.python_version()}")
          print(f"Django {django_version}")
          print(f"Django REST Framework {drf_version}")
          assert django_version.startswith(f"{os.environ['EXPECTED_DJANGO']}.")
          assert drf_version == os.environ["EXPECTED_DRF"]
          PY
      - name: Test pinned compatibility environment
        run: pytest
